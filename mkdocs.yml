site_name: LLM-Powered Expense Tracker
site_description: Automated expense tracking for e-payments via Android Tasker + LLM, with Google Forms fallback for cash transactions
site_url: https://johnchik.github.io/llm-expense-tracker/
repo_url: https://github.com/johnchik/llm-expense-tracker
repo_name: johnchik/llm-expense-tracker

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Setup Guide:
    - Tasker Configuration: setup/tasker-setup.md
    - Google Apps Script: setup/gas-setup.md
    - Google Forms Setup: setup/forms-setup.md
    - Google Sheets Visualization: setup/sheets-setup.md
  - User Guide:
    - E-Payment Automation: guide/epayment-tracking.md
    - Cash Entry via Forms: guide/cash-entry.md
    - Transaction Classification: guide/classification.md
    - Visualization & Analytics: guide/analytics.md
  - API Reference: api.md
  - Examples: examples.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg

plugins:
  - search
